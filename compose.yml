services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: finpulse-postgres
    environment:
      POSTGRES_DB: finpulse
      POSTGRES_USER: finpulse
      POSTGRES_PASSWORD: finpulse
    ports:
      - "5432:5432"
    volumes:
      - finpulse-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finpulse -d finpulse"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  finpulse-data: